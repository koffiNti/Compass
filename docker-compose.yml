version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: compass_postgres
    restart: always
    environment:
      POSTGRES_USER: compass_user
      POSTGRES_PASSWORD: compass_password_2026
      POSTGRES_DB: compass_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compass_user -d compass_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: compass_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://compass_user:compass_password_2026@db:5432/compass_db
      - SECRET_KEY=compass_super_secret_jwt_key_2026_change_in_production_398231
      - DEFAULT_AI_PROVIDER=openai
      - DEFAULT_AI_MODEL=gpt-4o
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: compass_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
